version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: agrichain-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: agrichain123
      MONGO_INITDB_DATABASE: agrichain
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - agrichain-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: agrichain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agrichain-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agrichain-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:agrichain123@mongodb:27017/agrichain?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-here
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - agrichain-network

  # Frontend Web App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agrichain-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: ws://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agrichain-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agrichain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - agrichain-network

  # Ganache Local Blockchain
  ganache:
    image: trufflesuite/ganache-cli:latest
    container_name: agrichain-ganache
    restart: unless-stopped
    command: ganache-cli --host 0.0.0.0 --port 8545 --networkId 5777 --gasLimit 6721975 --gasPrice 20000000000 --accounts 10 --defaultBalanceEther 100 --deterministic
    ports:
      - "8545:8545"
    networks:
      - agrichain-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  agrichain-network:
    driver: bridge
